# Business rules for the Ops Reconciliation Engine.
#
# Configurable business thresholds and outcomes. The Python code reads these
# values through src/config.py; salary/bonus/overtime severity bands are fixed.
# Severities are one of: info, warning, critical.

# Fields that must be present and non-empty on every record.
# employee_id is the record key and is always required, even if removed here.
required_fields:
  - employee_id
  - first_name
  - last_name
  - contract_type
  - monthly_salary

# Whether an issue of a given severity lands in the human review queue.
# Individual rules can override this with an explicit requires_review flag.
review_policy:
  info: false
  warning: true
  critical: true

missing_data:
  severity: critical

invalid_values:
  severity: critical            # invalid numbers/dates, negative salary, end before start
  malformed_email_severity: warning

duplicates:
  employee_id: critical         # mandatory; duplicate IDs always require review
  email: warning
  iban: warning

salary_change:
  warning_percentage: 15        # change above this (in absolute %) is a warning
  critical_percentage: 30       # change above this is critical

bonus:
  warning_salary_ratio: 0.5     # bonus above 50% of monthly salary
  critical_salary_ratio: 1.0    # bonus above 100% of monthly salary

overtime:
  minimum_hours: 0              # below this is critical (negative overtime)
  warning_hours: 60
  critical_hours: 100

iban_change:
  requires_review: true         # mandatory safety invariant
  severity: critical            # cannot be downgraded

contract_changes:
  contract_type:
    severity: warning
  working_hours:
    severity: warning
  department:
    severity: info

lifecycle:
  new_record:
    severity: info
  removed_record:
    severity: warning
  start_date_changed:
    severity: warning
  end_date_added:
    severity: warning
  end_date_changed:
    severity: warning

# Columns whose values must never be displayed or exported in full.
# IBAN is always included; employee_id must remain visible for record identification.
masked_fields:
  - iban

# Language of the interface, finding messages and explanations (en or it). The
# sidebar can override it for a session. See rules/validation_rules.it.yaml for
# a complete Italian profile.
language: en

# How numbers and dates are written in the input files and shown to people.
# Italian exports: decimal_separator ",", thousands_separator ".", dates "%d/%m/%Y".
formats:
  input_date_formats: ["%Y-%m-%d", "%d/%m/%Y"]   # tried in this order
  output_date_format: "%Y-%m-%d"
  decimal_separator: "."
  thousands_separator: ","

# Review history: decisions operators record on findings (accepted, needs action)
# are kept in this SQLite file and re-attached when the same finding comes back.
# Nothing is written until a decision is saved. Set enabled: false to turn it off.
history:
  enabled: true
  path: history/review_history.sqlite

# Expected changes (optional third CSV of approved changes). A change that matches
# an entry is downgraded to info; one that was expected but did not happen is
# reported with this severity. IBAN changes are never downgraded.
expected_changes:
  missing_severity: warning
